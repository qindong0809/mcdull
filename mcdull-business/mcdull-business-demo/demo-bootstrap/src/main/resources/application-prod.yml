server:
  port: ${DEMO_SERVER_PORT:6070}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${DEMO_REDIS_HOST}
      port: ${DEMO_REDIS_PORT:6379}
      password: ${DEMO_REDIS_PASSWORD:}
      database: ${DEMO_REDIS_DB:1}
      timeout: ${DEMO_REDIS_TIMEOUT:3s}
  datasource:
    url: ${DEMO_DB_URL}
    username: ${DEMO_DB_USER}
    password: ${DEMO_DB_PASSWORD}

mcdull:
  tag:
    # 生产默认关闭；需要灰度路由时显式设置 DEMO_TAG_ENABLED=true。
    enabled: ${DEMO_TAG_ENABLED:false}
    # 灰度开启后不允许回流基准实例，避免流量串到未标记版本。
    strict: true
    # 生产网关应设置 clean-header=true；业务服务不要清洗，否则下游拿不到标签。
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.demo: info

knife4j:
  production: true
