server:
  port: ${DEMO_SERVER_PORT:6070}

spring:
  data:
    redis:
      host: ${DEMO_REDIS_HOST:localhost}
      port: ${DEMO_REDIS_PORT:6379}
      password: ${DEMO_REDIS_PASSWORD:}
      database: ${DEMO_REDIS_DB:0}
      timeout: ${DEMO_REDIS_TIMEOUT:3s}
  datasource:
    url: ${DEMO_DB_URL:jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai}
    username: ${DEMO_DB_USER:root}
    password: ${DEMO_DB_PASSWORD:123456}

mcdull:
  tag:
    # 本地直连本机 MySQL/Redis，无 Feign 调用链时不需要 tag。
    enabled: false
    strict: false
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.demo: debug
