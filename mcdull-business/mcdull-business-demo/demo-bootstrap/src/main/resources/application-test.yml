server:
  port: ${DEMO_SERVER_PORT:6070}

spring:
  data:
    redis:
      host: ${DEMO_REDIS_HOST}
      port: ${DEMO_REDIS_PORT:6379}
      password: ${DEMO_REDIS_PASSWORD:}
      database: ${DEMO_REDIS_DB:1}
      timeout: ${DEMO_REDIS_TIMEOUT:3s}
  datasource:
    url: jdbc:mysql://${DEMO_DB_HOST}:3306/demo?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${DEMO_DB_USER}
    password: ${DEMO_DB_PASSWORD}

mcdull:
  tag:
    enabled: ${DEMO_TAG_ENABLED:true}
    strict: false
    # 清洗请求头是网关职责，业务服务保持 false。
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.demo: info

knife4j:
  production: true
