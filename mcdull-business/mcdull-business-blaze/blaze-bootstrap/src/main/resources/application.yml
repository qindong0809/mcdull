spring:
  application:
    name: blaze-bootstrap
  main:
    # 允许循环引用
    allow-circular-references: true
  profiles:
    # 不设默认值：缺失时直接启动失败，避免生产误用本地配置
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:mcdull.io:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        metadata:
          env-tag: ${ENV_TAG:${user.name}}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    poolType: Druid
    initialSize: 1
    minIdle: 1
    maxActive: 10
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: select 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxOpenPreparedStatements: 20
    logSlowSql: true
    adminUser: ${BLAZE_DRUID_ADMIN_USER:root}
    adminPassword: ${BLAZE_DRUID_ADMIN_PASSWORD:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  undertow:
    buffer-size: 1024
    io-threads: 4
    worker-threads: 20
    max-initial-line-length: 10MB
    max-parameter-size: 10MB
    max-header-size: 10MB
    max-post-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  # 日志文件目录
  file:
    path: ${BLAZE_LOG_PATH:./logs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE}

sa-token:
  active-timeout: 1800
  timeout: 86400
  token-name: Authorization

mcdull:
  gateway:
    no-auth:
      - /pub/**
      - /favicon.ico
      - /error
  oss:
    access-key:
    secret-key:
    max-file-size: 10000
    max-request-size: 10000

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn
