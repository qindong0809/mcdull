server:
  port: ${FOCUS_SERVER_PORT:6060}

spring:
  data:
    redis:
      host: ${FOCUS_REDIS_HOST:localhost}
      port: ${FOCUS_REDIS_PORT:6379}
      password: ${FOCUS_REDIS_PASSWORD:}
      database: ${FOCUS_REDIS_DB:1}
      timeout: ${FOCUS_REDIS_TIMEOUT:3s}
  datasource:
    url: jdbc:mysql://${FOCUS_DB_HOST}:3306/focus?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${FOCUS_DB_USER}
    password: ${FOCUS_DB_PASSWORD}

mcdull:
  gateway:
    no-auth:
      - /register
      - /login
      - /guest-mode
      - /doc.html
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
      - /error
  tag:
    enabled: false
    strict: false
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.focus: debug

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
