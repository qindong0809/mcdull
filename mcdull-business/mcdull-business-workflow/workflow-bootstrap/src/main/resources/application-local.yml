server:
  port: ${WORKFLOW_SERVER_PORT:6080}

spring:
  data:
    redis:
      host: ${WORKFLOW_REDIS_HOST:localhost}
      port: ${WORKFLOW_REDIS_PORT:6379}
      password: ${WORKFLOW_REDIS_PASSWORD:}
      database: ${WORKFLOW_REDIS_DB:1}
      timeout: ${WORKFLOW_REDIS_TIMEOUT:3s}
  datasource:
    url: jdbc:mysql://${WORKFLOW_DB_HOST}:3306/mcdull-cloud-3?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${WORKFLOW_DB_USER}
    password: ${WORKFLOW_DB_PASSWORD}

mcdull:
  tag:
    enabled: false
    strict: false
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.workflow: debug
