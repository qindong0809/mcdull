server:
  port: ${SYSTEM_SERVER_PORT:8099}

spring:
  data:
    redis:
      host: ${SYSTEM_REDIS_HOST:localhost}
      port: ${SYSTEM_REDIS_PORT:6379}
      password: ${SYSTEM_REDIS_PASSWORD:}
      database: ${SYSTEM_REDIS_DB:1}
      timeout: ${SYSTEM_REDIS_TIMEOUT:10s}
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  datasource:
    url: jdbc:mysql://${SYSTEM_DB_HOST}:3306/mcdull-cloud-3?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${SYSTEM_DB_USER}
    password: ${SYSTEM_DB_PASSWORD}

mcdull:
  gateway:
    no-auth:
      - /administrator/auth/login
      - /administrator/captcha/image
      - /doc.html
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
      - /error
    # 是否校验网关下发的 Same-Token 本地直连子服务调试时可关闭；默认开启，确保外部请求都经过网关
    same-token-enabled: false
  tag:
    enabled: false
    strict: false
    clean-header: false

sa-token:
  active-timeout: 6000
  timeout: 9000

logging:
  level:
    io.gitee.dqcer.mcdull.system: INFO
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
