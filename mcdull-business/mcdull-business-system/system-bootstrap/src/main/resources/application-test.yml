server:
  port: ${SYSTEM_SERVER_PORT:8099}

spring:
  data:
    redis:
      host: ${SYSTEM_REDIS_HOST}
      port: ${SYSTEM_REDIS_PORT:6379}
      password: ${SYSTEM_REDIS_PASSWORD:}
      database: ${SYSTEM_REDIS_DB:1}
      timeout: ${SYSTEM_REDIS_TIMEOUT:10s}
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  datasource:
    url: jdbc:mysql://${SYSTEM_DB_HOST}:3306/mcdull-cloud-3?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${SYSTEM_DB_USER}
    password: ${SYSTEM_DB_PASSWORD}

mcdull:
  tag:
    enabled: ${SYSTEM_TAG_ENABLED:true}
    strict: false
    clean-header: false

logging:
  level:
    io.gitee.dqcer.mcdull.system: info

knife4j:
  production: true
