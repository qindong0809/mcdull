<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流中心 · warm-flow 集成原型</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --line:#e7ebf2; --line2:#f0f3f8;
  --text:#1a1f29; --sub:#5f6b7f; --muted:#8b96a8;
  --pri:#2563eb; --prih:#1d4ed8; --priw:#eef4ff;
  --green:#0f9f6e; --greenw:#e9f8f1;
  --amber:#b8770a; --amberw:#fdf3e2;
  --red:#d92d20; --redw:#fdeceb;
  --gray:#6b7688; --grayw:#f2f5f9;
  --r:12px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
a{text-decoration:none;color:inherit}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;min-width:1080px}
.sidebar{width:222px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#3b82f6,#1e40af);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;box-shadow:0 2px 6px rgba(37,99,235,.35)}
.brand-t{font-size:14px;font-weight:650;letter-spacing:-.2px}
.brand-s{font-size:11px;color:var(--muted);margin-top:1px}
.nav{padding:4px 10px 10px;flex:1;overflow:auto}
.nav-group{font-size:11px;color:var(--muted);padding:12px 8px 6px;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--sub);cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s}
.nav-item:hover{background:#f6f8fc;color:var(--text)}
.nav-item.on{background:var(--priw);color:var(--pri);font-weight:600}
.nav-item svg{flex:none;opacity:.85}
.nav-item.on svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--pri);color:#fff;font-size:11px;height:18px;min-width:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.nav-item.on .nav-badge{background:#fff;color:var(--pri)}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot-live{width:6px;height:6px;border-radius:99px;background:var(--green)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--text);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ghost-chip{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 9px;display:flex;align-items:center;gap:5px}
.avatar{width:28px;height:28px;border-radius:8px;background:#eef1f7;color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.content{flex:1;overflow:auto;padding:20px 24px 40px}

/* ---------- common ---------- */
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.page-head h1{font-size:20px;font-weight:650;letter-spacing:-.3px}
.page-head p{color:var(--sub);font-size:12.5px;margin-top:4px}
.page-head .acts{margin-left:auto;display:flex;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-head h3{font-size:13.5px;font-weight:650}
.card-head .more{margin-left:auto;font-size:12px;color:var(--muted)}
.btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:#c9d3e4;background:#fbfcfe}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.25)}
.btn.pri:hover{background:var(--prih);border-color:var(--prih)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{background:#f3f6fb;color:var(--text)}
.btn.danger{color:var(--red);border-color:#f2cdc9}
.btn.danger:hover{background:var(--redw)}
.btn.sm{height:27px;padding:0 10px;font-size:12px;border-radius:7px}
.link{border:0;background:none;color:var(--pri);font-size:12.5px;cursor:pointer;padding:0 5px;border-radius:5px}
.link:hover{background:var(--priw);text-decoration:underline}
.link.mute{color:var(--sub)}
.link.mute:hover{background:var(--grayw);color:var(--text);text-decoration:none}
.inp{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:13px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:#9dbcf7;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.inp.search{padding-left:30px;width:220px}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:13px;color:var(--text);outline:none;cursor:pointer}
.toolbar{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.toolbar .right{margin-left:auto;font-size:12px;color:var(--muted)}
.searchwrap{position:relative;display:inline-flex;align-items:center}
.searchwrap svg{position:absolute;left:9px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip i{width:5px;height:5px;border-radius:99px;background:currentColor}
.t-blue{color:#1d4ed8;background:#eef4ff}
.t-green{color:#0b7a55;background:var(--greenw)}
.t-amber{color:var(--amber);background:var(--amberw)}
.t-red{color:var(--red);background:var(--redw)}
.t-gray{color:var(--gray);background:var(--grayw)}
.t-teal{color:#0b7285;background:#e7f6f8}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:9px 14px;background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--sub);vertical-align:middle}
.tbl tr:hover td{background:#f9fbfe}
.tbl tr.clickable{cursor:pointer}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl th:last-child,.tbl td:last-child{padding-right:18px;text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);letter-spacing:-.2px}
.cell{display:flex;flex-direction:column;gap:1px}
.cell .t{color:var(--text);font-size:13px;font-weight:500}
.cell .s{font-size:11.5px;color:var(--muted)}
.two{display:flex;align-items:center;gap:10px}
.icn-sq{width:30px;height:30px;border-radius:8px;background:#f0f4fb;color:#3563c9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.pager{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;font-size:12px;color:var(--muted)}
.pager .btns{display:flex;gap:6px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lb{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:640;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .ft{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px}
.up{color:var(--green)}
.down{color:var(--red)}
.kpi .glyph{position:absolute;right:12px;top:12px;opacity:.09}

/* ---------- overview ---------- */
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
.list-row{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.list-row:hover{background:#f9fbfe}
.list-row:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-t{font-size:12.8px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:20px;height:120px;padding:0 6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar-pair{display:flex;align-items:flex-end;gap:4px;height:96px}
.bar{width:12px;border-radius:4px 4px 2px 2px;background:#cfe0ff;transition:height .3s}
.bar.g{background:#bfeade}
.bar-x{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub)}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 4px}
.tab{padding:9px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--pri)}
.tab .n{font-size:11px;color:var(--muted);background:#f2f5f9;border-radius:8px;padding:0 5px;height:16px;display:inline-flex;align-items:center}
.tab.on .n{background:var(--priw);color:var(--pri)}

/* ---------- drawer ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.34);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:780px;max-width:94vw;background:#fff;z-index:41;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:-16px 0 48px rgba(16,24,40,.14)}
.drawer.on{transform:translateX(0)}
.dr-head{padding:16px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-head h3{font-size:16px;font-weight:650;letter-spacing:-.2px}
.dr-head p{font-size:11.5px;color:var(--muted);margin-top:3px}
.xbtn{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:#f5f7fb;color:var(--text)}
.dr-body{flex:1;overflow:auto;padding:16px 22px 28px}
.dr-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:#fcfdff}
.dr-foot .hint{font-size:11.5px;color:var(--muted)}
.dr-foot .right{margin-left:auto;display:flex;gap:9px}

/* ---------- detail bits ---------- */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv .i{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;gap:10px;font-size:12.5px}
.kv .i:last-child{border-bottom:0}
.kv .k{width:76px;flex:none;color:var(--muted)}
.kv .v{color:var(--text);word-break:break-all}
.sec-title{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin:18px 0 9px}
.mini-tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.mini-tbl th{background:#fafbfd;color:var(--muted);font-weight:500;font-size:11.5px;padding:7px 12px;text-align:left;border-bottom:1px solid var(--line)}
.mini-tbl td{padding:8px 12px;border-bottom:1px solid var(--line2);color:var(--sub)}
.mini-tbl tr:last-child td{border-bottom:0}
.legend-bar{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--sub);padding:8px 2px}

/* ---------- diagram ---------- */
.diagram{width:100%;display:block;overflow:visible}
.dcanvas{width:720px;height:560px;overflow:visible}
.diagram .nd{cursor:move}
.diagram .port{fill:#fff;stroke:#2563eb;stroke-width:1.6;opacity:.5;cursor:crosshair}
.diagram .nd:hover .port{opacity:1}
.dgram-wrap{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px 6px;overflow:hidden}
.dgram-wrap .diagram{max-width:800px;margin:0 auto}
.diagram .body{fill:#fff;stroke:#dae1ec;stroke-width:1.5;transition:stroke .2s}
.diagram .nd-task .body{fill:#fff}
.diagram .nd-start .body,.diagram .nd-end .body{fill:#f3f7fd;stroke:#c9d6ea}
.diagram .nd-gateway .body,.diagram .nd-parallel .body{fill:#f7f5ff;stroke:#cfd2ea}
.diagram .nd-done .body{fill:#ecfaf3;stroke:#0f9f6e}
.diagram .nd-done .tname{fill:#0b7a55}
.diagram .nd-cur .body{fill:#eef4ff;stroke:#2563eb;stroke-width:2;animation:pulse 2.2s ease-in-out infinite}
.diagram .nd-cur .tname{fill:#1d4ed8}
.diagram .nd-pending .body{fill:#fff;stroke:#dde3ed;stroke-dasharray:5 3}
.diagram .tname{font-size:13px;font-weight:500;fill:#1f2937}
.diagram .tname.sm{font-size:11px}
.diagram .tname.xs{font-size:10px}
.diagram .tsub{font-size:10.5px;fill:#8b96a8}
.diagram .pmark{font-size:13px;fill:#8b96a8;font-weight:600}
.diagram .bar{fill:#c7d6ef}
.diagram .nd-done .bar{fill:#0f9f6e}
.diagram .nd-cur .bar{fill:#2563eb}
.diagram .edge-line{fill:none;stroke:#c3ccdb;stroke-width:1.6}
.diagram .eg.done .edge-line{stroke:#7fd0b3}
.diagram .eg.live .edge-line{stroke:#93b4f4;stroke-dasharray:6 4}
.diagram .cond-bg{fill:#f6f8fc;stroke:#e3e9f3;stroke-width:1}
.diagram .cond-tx{font-size:10.5px;fill:#5f6b7f}
.diagram .nowtag{font-size:10px;fill:#2563eb;font-weight:600}
@keyframes pulse{0%,100%{stroke-width:2}50%{stroke-width:3.6}}

/* ---------- designer ---------- */
.dwrap{height:calc(100vh - 96px);display:flex;flex-direction:column;gap:12px}
.dbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);flex:none}
.dbar .nm{font-size:14px;font-weight:650}
.dbar .code{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.dbar .spacer{flex:1}
.dbar .save-state{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dbody{flex:1;display:flex;gap:12px;min-height:0}
.palette{width:168px;flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;box-shadow:var(--shadow)}
.palette .pt{font-size:11px;color:var(--muted);letter-spacing:.5px;font-weight:600;margin-bottom:8px}
.pal-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line2);border-radius:9px;margin-bottom:7px;cursor:grab;background:#fff;transition:border-color .15s,box-shadow .15s,transform .1s}
.pal-item:hover{border-color:#c9d8f5;box-shadow:0 2px 6px rgba(37,99,235,.1);transform:translateY(-1px)}
.pal-item:active{cursor:grabbing}
.pal-item .pi{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#f5f8fd;color:#3b6bc9}
.pal-item .pt-t{font-size:12.5px;font-weight:500;color:var(--text);line-height:1.2}
.pal-item .pt-s{font-size:10.5px;color:var(--muted)}
.pal-tip{font-size:11px;color:var(--muted);line-height:1.7;padding:6px 2px;border-top:1px dashed var(--line);margin-top:8px}
.canvas-card{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:auto;box-shadow:var(--shadow);background-image:radial-gradient(circle,#eef1f7 1px,transparent 1.2px);background-size:16px 16px}
.canvas-card svg{display:block}
.canvas-hint{position:absolute;left:14px;top:10px;font-size:11px;color:#a4afc0;pointer-events:none;background:rgba(255,255,255,.72);padding:2px 6px;border-radius:5px}
.props{width:272px;flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
.props .ph{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.props .ph h4{font-size:12.5px;font-weight:650}
.props .ph .ty{margin-left:8px}
.pbody{padding:12px 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px}
.field .inp,.field .sel{width:100%;height:30px;font-size:12.5px}
.field textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;color:var(--text);outline:none;resize:vertical}
.field textarea:focus{border-color:#9dbcf7;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.field .tip{font-size:10.5px;color:var(--muted);margin-top:4px}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);padding:5px 0;cursor:pointer}
.check input{accent-color:var(--pri);width:14px;height:14px}
.pempty{padding:26px 18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.pempty .big{font-size:22px;color:#d3daea;margin-bottom:6px}
.check-panel{position:absolute;left:14px;bottom:14px;width:330px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(16,24,40,.14);z-index:5;overflow:hidden}
.check-panel .cph{padding:9px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line2);font-size:12px;font-weight:600}
.check-panel .cph .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none;font-size:14px}
.check-panel .list{max-height:190px;overflow:auto}
.check-panel .row{padding:8px 12px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--sub);display:flex;gap:7px;cursor:pointer}
.check-panel .row:hover{background:#f9fbfe}
.check-panel .row span.n{color:var(--red);flex:none}
.check-panel .foot{padding:8px 12px;font-size:11px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-16px);background:#1f2937;color:#fff;font-size:13px;padding:9px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(16,24,40,.22);opacity:0;pointer-events:none;transition:all .22s;z-index:60;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#0f7a5c}
.toast.warn{background:#a5630a}

/* ---------- task form ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin-top:6px}
.form-grid .fg{padding:9px 12px;background:#fafbfd;border:1px solid var(--line2);border-radius:8px}
.form-grid .fg .k{font-size:11px;color:var(--muted)}
.form-grid .fg .v{font-size:12.5px;color:var(--text);margin-top:2px}
.form-grid .wide{grid-column:1/-1}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 0}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:2px;width:13px;height:13px;border-radius:99px;background:#fff;border:2px solid #c9d3e4}
.tl-item.now .tl-dot{border-color:var(--pri);background:var(--priw)}
.tl-item.ok .tl-dot{border-color:var(--green);background:var(--greenw)}

/* =======================================================================
   图形渲染（流程图 / 设计器共用）
   ======================================================================= */
function dims(n) {
  if (n.type === 'start' || n.type === 'end') return { w: 110, h: 44 };
  if (n.type === 'gateway' || n.type === 'parallel') return { w: 96, h: 72 };
  return { w: 140, h: 56 };
}
function outPort(n) {
  const d = dims(n);
  return { x: n.x + d.w / 2, y: n.y + d.h };
}
function inPort(n) {
  const d = dims(n);
  return { x: n.x + d.w / 2, y: n.y };
}
function edgeGeom(a, b) {
  const A = dims(a), B = dims(b);
  const ac = { x: a.x + A.w / 2, y: a.y + A.h / 2 };
  const bc = { x: b.x + B.w / 2, y: b.y + B.h / 2 };
  if (bc.y - ac.y > 50) return { p1: { x: ac.x, y: a.y + A.h }, p2: { x: bc.x, y: b.y }, dir: 'v' };
  return { p1: { x: a.x + A.w, y: ac.y }, p2: { x: b.x, y: bc.y }, dir: 'h' };
}
function curve(p1, p2, dir) {
  if (dir === 'v') {
    const dy = Math.max(26, Math.abs(p2.y - p1.y) / 2);
    return 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + (p1.y + dy) + ' ' + p2.x + ',' + (p2.y - dy) + ' ' + p2.x + ',' + p2.y;
  }
  const dx = Math.max(30, Math.abs(p2.x - p1.x) / 2);
  return 'M' + p1.x + ',' + p1.y + ' C' + (p1.x + dx) + ',' + p1.y + ' ' + (p2.x - dx) + ',' + p2.y + ' ' + p2.x + ',' + p2.y;
}
function nodeSVG(n, state, opt) {
  opt = opt || {};
  const d = dims(n);
  const sel = opt.selected === n.id;
  let body = '';
  if (n.type === 'gateway' || n.type === 'parallel') {
    const nm = cut(n.name, 8);
    const l1 = nm.length > 4 ? nm.slice(0, 4) : nm;
    const l2 = nm.length > 4 ? nm.slice(4) : '';
    body = '<polygon class="body" points="48,0 96,36 48,72 0,36"/>' +
      (l2
        ? '<text class="tname xs" x="48" y="33" text-anchor="middle">' + esc(l1) + '</text>' +
          '<text class="tname xs" x="48" y="46" text-anchor="middle">' + esc(l2) + '</text>'
        : '<text class="tname xs" x="48" y="40" text-anchor="middle">' + esc(l1) + '</text>') +
      (n.type === 'parallel' ? '<text class="pmark" x="48" y="20" text-anchor="middle">+</text>' : '');
  } else if (n.type === 'start' || n.type === 'end') {
    body = '<rect class="body" x="0" y="0" width="110" height="44" rx="22"/>' +
      '<text class="tname" x="55" y="27" text-anchor="middle">' + esc(cut(n.name, 6)) + '</text>';
  } else {
    body = '<rect class="body" x="0" y="0" width="140" height="56" rx="9"/>' +
      '<rect class="bar" x="0" y="10" width="3" height="36" rx="1.5"/>' +
      '<text class="tname" x="70" y="25" text-anchor="middle">' + esc(cut(n.name, 9)) + '</text>' +
      (n.assignee ? '<text class="tsub" x="70" y="42" text-anchor="middle">' + esc(cut(n.assignee, 11)) + '</text>' : '');
  }
  let extra = '';
  if (sel) extra += '<rect class="selring" x="-7" y="-7" width="' + (d.w + 14) + '" height="' + (d.h + 14) + '" rx="13" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>';
  if (state === 'current') extra += '<text class="nowtag" x="' + (d.w - 2) + '" y="-6" text-anchor="end">当前节点</text>';
  let ports = '';
  if (opt.editable && n.type !== 'end') {
    const p = outPort(n);
    ports = '<circle class="port" data-port="' + n.id + '" cx="' + (p.x - n.x) + '" cy="' + (p.y - n.y) + '" r="5.5"/>' +
      '<circle class="port-hit" data-port="' + n.id + '" cx="' + (p.x - n.x) + '" cy="' + (p.y - n.y) + '" r="12" fill="transparent"/>';
  }
  return '<g class="nd nd-' + n.type + (state ? ' nd-' + state : '') + (sel ? ' is-sel' : '') + '" data-node="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">' + extra + body + ports + '</g>';
}

function edgeLabel(e, p1, p2) {
  if (!e.cond) return '';
  const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  const w = Math.min(160, e.cond.length * 7 + 14);
  return '<rect class="cond-bg" x="' + (mx - w / 2) + '" y="' + (my - 11) + '" width="' + w + '" height="19" rx="5" />' +
    '<text class="cond-tx" x="' + mx + '" y="' + (my + 2) + '" text-anchor="middle">' + esc(e.cond) + '</text>';
}

function diagram(nodes, edges, opt) {
  opt = opt || {};
  const states = opt.states || {};
  const defs = '<defs>' +
    ['#c3ccdb', '#0f9f6e', '#2563eb'].map((c, i) =>
      '<marker id="ar' + i + '" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="' + c + '"/></marker>').join('') +
    '<marker id="arS" markerWidth="8" markerHeight="8" refX="6.6" refY="2.8" orient="auto"><path d="M0,0 L6.6,2.8 L0,5.6 z" fill="#2563eb"/></marker>' +
    '</defs>';
  let es = '';
  edges.forEach((e, i) => {
    const a = nodes.find((n) => n.id === e.from), b = nodes.find((n) => n.id === e.to);
    if (!a || !b) return;
    const g = edgeGeom(a, b);
    const p1 = g.p1, p2 = g.p2;
    const d = curve(p1, p2, g.dir);
    const done = states[e.from] === 'done' && states[e.to] === 'done';
    const live = states[e.from] === 'done' && states[e.to] === 'current' && (!opt.liveFrom || opt.liveFrom === e.from);
    const cls = done ? 'done' : (live ? 'live' : '');
    const mk = done ? 'ar1' : (live ? 'ar2' : 'ar0');
    const selEdge = opt.selEdge === i;
    es += '<g class="eg ' + cls + (selEdge ? ' is-sel' : '') + '"' + (opt.editable ? ' data-edge="' + i + '"' : '') + '>' +
      (opt.editable ? '<path class="edge-hit" d="' + d + '" stroke="transparent" stroke-width="12" fill="none"/>' : '') +
      '<path class="edge-line" d="' + d + '" marker-end="url(#' + mk + ')"' + (selEdge ? ' style="stroke:#2563eb;stroke-width:2"' : '') + '/>' +
      edgeLabel(e, p1, p2) + '</g>';
  });
  let ns = '';
  nodes.forEach((n) => { ns += nodeSVG(n, states[n.id], opt); });
  const inner = defs + es + ns;
  if (opt.inner) return inner;
  return '<svg viewBox="0 0 720 560" class="diagram" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
}

/* =======================================================================
   视图：流程图
   ======================================================================= */
function liveFromOf(inst) {
  if (!inst || !inst.curNode) return null;
  const p = inst.passed || [];
  return p.length ? p[p.length - 1] : null;
}
function statesFor(inst) {
  const def = DEFS.find((d) => d.id === inst.defId);
  const st = {};
  def.nodes.forEach((n) => {
    if (inst.status === 'completed') st[n.id] = 'done';
    else if ((inst.passed || []).includes(n.id)) st[n.id] = 'done';
    else if (n.id === inst.curNode) st[n.id] = 'current';
    else st[n.id] = 'pending';
  });
  return st;
}
function viewFlow() {
  const def = DEFS.find((d) => d.id === ui.flowDef) || DEFS[0];
  const inst = INSTANCES.find((i) => i.id === ui.flowInst);
  const states = inst ? statesFor(inst) : {};
  const instOptions = INSTANCES.filter((i) => i.defId === def.id);
  return '<div class="page">' +
    '<div class="page-head"><div><h1>流程图</h1><p>由 flow_node + flow_skip 实时渲染，可挂载实例的流转状态，用于进度追踪与节点耗时分析。</p></div>' +
    '<div class="acts"><button class="btn" data-act="def-design" data-id="' + def.id + '">在设计中打开</button></div></div>' +
    '<div class="card"><div class="toolbar">' +
    '<select class="sel" data-bind="flowDef">' + DEFS.map((d) => '<option value="' + d.id + '"' + (d.id === def.id ? ' selected' : '') + '>' + esc(d.name) + '（' + d.code + '）</option>').join('') + '</select>' +
    '<select class="sel" data-bind="flowInst"><option value="">不叠加实例状态</option>' + instOptions.map((i) => '<option value="' + i.id + '"' + (i.id === ui.flowInst ? ' selected' : '') + '>' + esc(i.id) + ' · ' + esc(cut(i.title, 14)) + '</option>').join('') + '</select>' +
    '<div class="legend" style="margin-left:auto">' +
    '<span class="lg"><i style="background:#ecfaf3;border:1px solid #0f9f6e"></i>已办结</span>' +
    '<span class="lg"><i style="background:#eef4ff;border:1px solid #2563eb"></i>当前节点</span>' +
    '<span class="lg"><i style="background:#fff;border:1px solid #dde3ed"></i>未到达</span></div>' +
    '</div>' +
    '<div style="padding:14px 18px 6px">' + (inst ? '<div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:#5f6b7f">' + instStatusChip(inst.status) + '<span>' + esc(inst.id) + '</span><span style="color:#c2cad8">·</span><span>' + esc(inst.title) + '</span><span style="color:#c2cad8">·</span><span>当前节点：' + esc(inst.cur) + '</span></div>' : '<div style="font-size:12px;color:#8b96a8">当前展示定义全貌，选择实例后可叠加流转状态</div>') +
    '</div>' +
    '<div style="padding:8px 14px 16px"><div class="dgram-wrap">' + diagram(def.nodes, def.edges, { states: states, liveFrom: liveFromOf(inst) }) + '</div></div>' +
    '<div style="padding:0 18px 16px"><table class="mini-tbl"><thead><tr><th>节点</th><th>类型</th><th>办理人</th><th>处理策略</th><th>出线条件</th><th>状态</th></tr></thead><tbody>' +
    def.nodes.map((n) => {
      const outs = def.edges.filter((e) => e.from === n.id);
      const st = states[n.id];
      return '<tr><td style="color:#1a1f29">' + esc(n.name) + '</td>' +
        '<td>' + (TYPES[n.type] ? TYPES[n.type].label : n.type) + '</td>' +
        '<td>' + esc(n.assignee || '—') + '</td><td>' + esc(n.type === 'task' ? n.policy : '—') + '</td>' +
        '<td>' + (outs.length ? outs.map((o) => esc(o.cond || '无条件')).join(' / ') : '—') + '</td>' +
        '<td>' + (st === 'done' ? chip('已办结', 'green') : st === 'current' ? chip('进行中', 'blue') : st === 'pending' ? chip('未到达', 'gray') : '—') + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div></div>';
}

    '<span class="lg"><i style="background:#ecfaf3;border:1px solid #0f9f6e"></i>已办结</span>' +
    '<span class="lg"><i style="background:#eef4ff;border:1px solid #2563eb"></i>当前节点</span>' +
    '<span class="lg"><i style="background:#fff;border:1px solid #dde3ed"></i>未到达</span></div></div>' +
    '<div style="padding:12px 14px"><div class="dgram-wrap">' + diagram(def.nodes, def.edges, { states: states, liveFrom: liveFromOf(inst) }) + '</div></div></div>' +
    '<div class="card" style="margin-top:14px"><div class="card-head"><h3>流转记录</h3><span class="more">共 ' + timeline.length + ' 条</span></div>' +
    '<div style="padding:16px 18px">' +
    (timeline.length ? '<div class="timeline">' + timeline.map((h) =>
      '<div class="tl-item ' + (h.result === '同意' || h.result === '提交' ? 'ok' : '') + '">' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-t">' + esc(h.node) + resultChip(h.result) + '<span style="font-weight:400;color:#8b96a8;font-size:11.5px">' + esc(h.handler) + ' · ' + esc(h.time) + ' · 耗时 ' + esc(h.cost) + '</span></div>' +
      (h.opinion ? '<div class="tl-o">' + esc(h.opinion) + '</div>' : '') +
      '</div>').join('') + '</div>' : '<div style="color:#8b96a8;font-size:12.5px">暂无流转记录</div>') +
    '</div></div></div>';
}
function kvRow(k, v) { return '<div class="i"><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>'; }
function stat(l, v) {

/* =======================================================================
   视图：设计器
   ======================================================================= */
function initDesigner(defId) {
  const def = DEFS.find((d) => d.id === defId) || DEFS[0];
  const firstTask = def.nodes.find((n) => n.type === 'task');
  designer = {
    defId: def.id, name: def.name, code: def.code,
    nodes: clone(def.nodes), edges: clone(def.edges),
    selNode: firstTask ? firstTask.id : null, selEdge: null, dirty: false, savedAt: def.updated,
    version: 'v3.9', draft: true
  };
}
function viewDesigner(defId) {
  if (!designer.defId || designer.defId !== defId) initDesigner(defId);
  const d = designer;
  const pal = Object.keys(TYPES).map((k) =>
    '<div class="pal-item" draggable="true" data-type="' + k + '">' +
    '<div class="pi">' + palIcon(k) + '</div>' +
    '<div><div class="pt-t">' + TYPES[k].label + '</div><div class="pt-s">' + palHint(k) + '</div></div>' +
    '</div>').join('');
  return '<div class="dwrap">' +
    '<div class="dbar">' +
    '<div><div class="nm">' + esc(d.name) + ' <span style="font-size:11px;font-weight:500;color:#8b96a8">' + esc(d.code) + ' · ' + esc(d.version) + '（' + (d.draft ? '草稿' : '已发布') + '）</span></div>' +
    '<div id="dcount" style="font-size:11px;color:#8b96a8;margin-top:2px">节点 ' + d.nodes.length + ' 个 · 跳线 ' + d.edges.length + ' 条 · 画布 720 × 560</div></div>' +
    '<div class="spacer"></div>' +
    '<div class="save-state" id="saveState"><span style="width:6px;height:6px;border-radius:9px;background:' + (d.dirty ? '#b8770a' : '#0f9f6e') + ';display:inline-block"></span>' + (d.dirty ? '有未保存修改' : '已保存 ' + esc(d.savedAt)) + '</div>' +
    '<button class="btn" data-act="d-preview">预览流程图</button>' +
    '<button class="btn" data-act="d-check">校验</button>' +
    '<button class="btn" data-act="d-save">保存草稿</button>' +
    '<button class="btn pri" data-act="d-publish">发布</button>' +
    '</div>' +
    '<div class="dbody">' +
    '<div class="palette"><div class="pt">节点组件</div>' + pal +
    '<div class="pal-tip">按住组件拖到画布即可添加。<br>拖动节点右侧小圆点可连线；选中节点后按 Delete 删除。</div></div>' +
    '<div class="canvas-card" id="canvasCard"><div class="canvas-hint">从左侧拖入节点 · 拖动节点调整位置 · 拖动右侧圆点连线</div>' +

    '</div>' +
    '<div class="props"><div class="ph"><h4>节点属性</h4><span class="ty" id="propType"></span></div><div class="pbody" id="props"></div></div>' +
    '</div></div>';
}
function palIcon(t) {
  if (t === 'start' || t === 'end') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>';
  if (t === 'task') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.6 2.6L16 9"/></svg>';
  if (t === 'gateway') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z"/></svg>';
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z"/><path d="M12 9v6M9 12h6"/></svg>';
}
function palHint(t) {
  return { start: '流程唯一入口', task: '人工办理 / 会签', gateway: '按条件走一条', parallel: '同时分流多路', end: '流程终点' }[t];
}

function renderCanvas() {
  const svg = $('#dcanvas');
  if (!svg) return;
  const d = designer;
  const nodes = d.nodes;
  let body = '<rect x="0" y="0" width="720" height="560" fill="transparent"/>';
  body += diagram(nodes, d.edges, { editable: true, selected: d.selNode, selEdge: d.selEdge, states: {}, inner: true });
  svg.innerHTML = body;
  const hint = $('#canvasCard .canvas-hint');
  if (hint) hint.style.display = 'none';
  const cnt = $('#dcount');
  if (cnt) cnt.textContent = '节点 ' + d.nodes.length + ' 个 · 跳线 ' + d.edges.length + ' 条 · 画布 720 × 560';
  const st = $('#saveState');
  if (st) st.innerHTML = '<span style="width:6px;height:6px;border-radius:9px;background:' + (d.dirty ? '#b8770a' : '#0f9f6e') + ';display:inline-block"></span>' + (d.dirty ? '有未保存修改' : '已保存 ' + esc(d.savedAt));
}

function renderProps() {
  const p = $('#props'), ty = $('#propType');
  if (!p) return;
  const d = designer;
  if (d.selEdge != null && d.edges[d.selEdge]) {
    const e = d.edges[d.selEdge];
    const a = d.nodes.find((n) => n.id === e.from), b = d.nodes.find((n) => n.id === e.to);
    ty.textContent = '跳线 flow_skip';
    p.innerHTML =
      '<div style="font-size:12px;color:#5f6b7f;background:#f7f9fc;border:1px solid #eff2f7;border-radius:8px;padding:8px 10px;margin-bottom:14px">' +

function bindDesigner() {
  designerActive = true;
  renderCanvas();
  renderProps();
  const svg = $('#dcanvas');
  const card = $('#canvasCard');
  if (!svg) return;

  const toSvg = (ev) => {
    const r = svg.getBoundingClientRect();
    const k = 720 / r.width;
    return { x: (ev.clientX - r.left) * k, y: (ev.clientY - r.top) * k };
  };

  let drag = null;
  svg.addEventListener('pointerdown', (ev) => {
    const port = ev.target.closest('[data-port]');
    const nodeEl = ev.target.closest('[data-node]');
    const edgeEl = ev.target.closest('[data-edge]');
    if (port) {
      ev.preventDefault();
      drag = { type: 'link', from: port.dataset.port };
      designer.selNode = port.dataset.port; designer.selEdge = null;
      renderCanvas(); renderProps();
      return;
    }
    if (nodeEl) {
      ev.preventDefault();
      const id = nodeEl.dataset.node;
      designer.selNode = id; designer.selEdge = null;
      const n = designer.nodes.find((x) => x.id === id);
      drag = { type: 'node', id: id, sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, moved: false };
      renderCanvas(); renderProps();
      return;
    }
    if (edgeEl) {
      designer.selEdge = Number(edgeEl.dataset.edge); designer.selNode = null;
      renderCanvas(); renderProps();
      return;
    }
    designer.selNode = null; designer.selEdge = null;
    renderCanvas(); renderProps();
  });

  window.addEventListener('pointermove', (ev) => {
    if (!drag || !designerActive) return;
    if (drag.type === 'node') {
      const n = designer.nodes.find((x) => x.id === drag.id);
      if (!n) return;
      const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) drag.moved = true;
      n.x = Math.max(8, Math.min(712 - dims(n).w, Math.round((drag.ox + dx) / 8) * 8));
      n.y = Math.max(12, Math.min(548 - dims(n).h, Math.round((drag.oy + dy) / 8) * 8));
      renderCanvas();
    } else if (drag.type === 'link') {
      const from = designer.nodes.find((x) => x.id === drag.from);
      if (!from) return;
      const p = outPort(from), m = toSvg(ev);
      let tl = $('#tline');
      if (!tl) {
        tl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tl.setAttribute('id', 'tline');
        tl.setAttribute('fill', 'none');
        tl.setAttribute('stroke', '#2563eb');
        tl.setAttribute('stroke-width', '1.8');
        tl.setAttribute('stroke-dasharray', '5 4');
        tl.setAttribute('pointer-events', 'none');
        svg.appendChild(tl);
      }
      tl.setAttribute('d', curve(p, m, 'v'));
    }
  });

  window.addEventListener('pointerup', (ev) => {
    if (!drag || !designerActive) return;
    if (drag.type === 'node') {
      if (drag.moved) { designer.dirty = true; renderCanvas(); }
    } else if (drag.type === 'link') {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const tgt = el && el.closest ? el.closest('[data-node]') : null;
      const toId = tgt ? tgt.dataset.node : null;
      if (toId && toId !== drag.from) {
        const exists = designer.edges.some((x) => x.from === drag.from && x.to === toId);
        if (exists) toast('这两个节点之间已有连线', 'warn');
        else { designer.edges.push({ from: drag.from, to: toId, cond: '', priority: 1, label: '' }); designer.dirty = true; }
      }
      const tl = $('#tline'); if (tl) tl.remove();
      renderCanvas(); renderProps();
    }
    drag = null;
  });

  svg.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
  svg.addEventListener('drop', (ev) => {
    ev.preventDefault();
    const type = ev.dataTransfer.getData('text/plain');
    if (!type) return;
    const p = toSvg(ev);
    addNode(type, p.x, p.y);
  });
  $$('.pal-item').forEach((it) => {
    it.addEventListener('dragstart', (ev) => {
      ev.dataTransfer.setData('text/plain', it.dataset.type);
      ev.dataTransfer.effectAllowed = 'copy';
    });
  });

  $('#props').addEventListener('input', onPropInput);
  $('#props').addEventListener('change', onPropInput);
}
function onPropInput(ev) {
  const f = ev.target.dataset.field;
  if (!f) return;
  const v = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
  const d = designer;
  if (d.selEdge != null && d.edges[d.selEdge]) {
    d.edges[d.selEdge][f] = v;
    d.dirty = true;
    renderCanvas();
  } else if (d.selNode) {
    const n = d.nodes.find((x) => x.id === d.selNode);
    if (!n) return;
    n[f] = v;
    d.dirty = true;
    if (f === 'name' || f === 'assignee') renderCanvas();
  }
}
function addNode(type, x, y) {
  const d = designer;
  const id = 'n' + (++seq);
  const w = dims({ type: type }).w, h = dims({ type: type }).h;
  let n = { id: id, name: TYPES[type].label, type: type, x: Math.round(x - w / 2), y: Math.round(y - h / 2), assignee: '', policy: '单人办理', right: '可编辑' };
  if (type === 'task') n.assignee = '部门主管';
  if (type === 'gateway') { n.name = '条件判断'; n.mode = '条件分支'; n.varName = 'days'; }
  if (type === 'parallel') { n.name = '并行网关'; n.mode = 'fork'; }
  n.x = Math.max(8, Math.min(712 - w, n.x));
  n.y = Math.max(12, Math.min(548 - h, n.y));
  d.nodes.push(n);
  d.selNode = id; d.selEdge = null; d.dirty = true;
  renderCanvas(); renderProps();
  toast('已添加「' + TYPES[type].label + '」', '');
}
function deleteSelected() {
  const d = designer;
  if (d.selEdge != null) {
    d.edges.splice(d.selEdge, 1);
    d.selEdge = null; d.dirty = true; renderCanvas(); renderProps(); toast('连线已删除', '');
  } else if (d.selNode) {
    const id = d.selNode;
    d.nodes = d.nodes.filter((n) => n.id !== id);
    d.edges = d.edges.filter((e) => e.from !== id && e.to !== id);
    d.selNode = null; d.dirty = true; renderCanvas(); renderProps(); toast('节点及其连线已删除', '');
  }
}
function validateDesigner() {
  const d = designer, out = [];
  const starts = d.nodes.filter((n) => n.type === 'start');
  const ends = d.nodes.filter((n) => n.type === 'end');
  if (starts.length !== 1) out.push({ id: starts[0] ? starts[0].id : null, msg: '开始节点必须且只能有 1 个，当前 ' + starts.length + ' 个' });
  if (!ends.length) out.push({ id: null, msg: '缺少结束节点，流程无法归档' });
  d.nodes.forEach((n) => {
    if (n.type === 'task' && !n.assignee) out.push({ id: n.id, msg: '节点「' + n.name + '」未配置办理人' });
    if (n.type !== 'end' && d.edges.filter((e) => e.from === n.id).length === 0) out.push({ id: n.id, msg: '节点「' + n.name + '」没有出线，流程会中断' });
    if (n.type === 'start' && d.edges.filter((e) => e.to === n.id).length) out.push({ id: n.id, msg: '开始节点不能有入线' });
  });
  d.edges.forEach((e) => {
    const a = d.nodes.find((n) => n.id === e.from);
    if (a && a.type === 'gateway' && !e.cond && a.mode !== 'default') out.push({ id: e.from, msg: '网关「' + a.name + '」的分支缺少条件表达式' });
  });
  return out;
}
function showCheck() {
  const card = $('#canvasCard');

  const old = $('.check-panel', card);
  if (old) old.remove();
  const list = validateDesigner();

  panel.className = 'check-panel';

}

  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'go': location.hash = id; break;
    case 'close-drawer': closeDrawer(); break;
    case 'def-open': openDefDrawer(id, 'info'); break;
    case 'def-design': closeDrawer(); location.hash = '#/designer/' + id; break;
    case 'dr-tab': dr.tab = id; renderDefDrawer(); break;
    case 'inst-open': location.hash = '#/instance/' + id; break;
    case 'inst-flow': openFlowDrawer(id); break;
    case 'inst-tab': ui.instTab = id; renderRoute(); break;
    case 'todo-tab': ui.todoTab = id; renderRoute(); break;
    case 'todo-open': openTodoDrawer(id); break;
    case 'todo-more': toast('更多操作：转办 / 加签 / 驳回 / 查看流程图', ''); break;
    case 'his-open': openHisDrawer(id); break;
    case 'cc-open': toast('抄送详情为只读视图（原型未展开）', ''); break;
    case 'fill-opinion': { const t = $('#opinion'); if (t) { t.value = id; } break; }
    case 'todo-approve': approveTask(id, '同意'); break;
    case 'todo-reject': approveTask(id, '驳回'); break;
    case 'todo-transfer': transferTask(id, '转办'); break;
    case 'todo-addsign': transferTask(id, '加签'); break;
    case 'urge': toast('已向当前办理人发送催办提醒', 'ok'); break;
    case 'terminate': toast('终止需要二次确认，原型中未执行（实例状态会变为已终止）', 'warn'); break;
    case 'copy-id': toast('实例编号已复制', 'ok'); break;
    case 'recalc': renderRoute(); toast('实例状态已刷新', 'ok'); break;
    case 'import-def': toast('支持导入 warm-flow JSON / BPMN 定义（原型为演示）', ''); break;
    case 'export-his': toast('已生成导出任务，稍后可在下载中心查看', 'ok'); break;
    case 'batch-transfer': toast('请勾选任务后批量转办（原型未展开）', ''); break;
    /* 设计器 */
    case 'd-check': showCheck(); break;
    case 'close-check': { const cp = el.closest('.check-panel'); if (cp) cp.remove(); break; }
    case 'd-locate':
      if (id) { designer.selNode = id; designer.selEdge = null; renderCanvas(); renderProps(); const cp = el.closest('.check-panel'); if (cp) cp.remove(); }
      break;
    case 'd-save':
      designer.dirty = false;
      designer.savedAt = '2026-11-19 ' + nowHM();
      renderCanvas(); toast('草稿已保存（示例：写 flow_definition 草稿态）', 'ok');
      break;
    case 'd-publish': {
      const list = validateDesigner();
      if (list.length) { showCheck(); toast('存在 ' + list.length + ' 个问题，修复后才能发布', 'warn'); }
      else {
        designer.dirty = false;
        designer.draft = false;
        const def = DEFS.find((d) => d.id === designer.defId);
        if (def) { def.version = 'v3.9'; }
        toast('发布成功，新实例将使用 v3.9 定义', 'ok');
        renderRoute();
      }
      break;
    }
    case 'd-preview': openPreviewDrawer(); break;
    case 'd-del-node': deleteSelected(); break;
    case 'd-del-edge': deleteSelected(); break;
    case 'd-dup-node': {
      const n = designer.nodes.find((x) => x.id === designer.selNode);
      if (!n) break;
      const cp = clone(n);
      cp.id = 'n' + (++seq); cp.x = Math.min(712 - dims(n).w, n.x + 24); cp.y = Math.min(548 - dims(n).h, n.y + 24); cp.name = n.name + ' 副本';
      designer.nodes.push(cp); designer.selNode = cp.id; designer.dirty = true;
      renderCanvas(); renderProps(); toast('节点已复制', '');
      break;
    }
  }
});

document.addEventListener('input', (ev) => {
  const b = ev.target.dataset.bind;
  if (!b) return;
  ui[b] = ev.target.value;
  renderRoute();
  const el = $('[data-bind="' + b + '"]');
  if (el) { el.focus(); if (el.setSelectionRange && el.type !== 'number') { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
});
document.addEventListener('change', (ev) => {
  const b = ev.target.dataset.bind;
  if (!b || ev.target.tagName !== 'SELECT') return;
  ui[b] = ev.target.value;
  if (b === 'flowDef') ui.flowInst = '';
  renderRoute();
});

document.addEventListener('keydown', (ev) => {
  if (!designerActive) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (ev.key === 'Delete' || ev.key === 'Backspace') {
    if (designer.selNode || designer.selEdge != null) { ev.preventDefault(); deleteSelected(); }
  }
  if (ev.key === 'Escape') { designer.selNode = null; designer.selEdge = null; renderCanvas(); renderProps(); }
});

function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function approveTask(id, result) {
  const idx = TODOS.findIndex((t) => t.id === id);
  if (idx < 0) return;
  const t = TODOS[idx];
  const op = $('#opinion');
  const txt = op && typeof op.value === 'string' ? op.value.trim() : '';
  if (result === '驳回' && !txt) { toast('驳回需要填写审批意见', 'warn'); return; }
  HISTORY.unshift({
    id: 'HT-' + String(30 + (seq++)), instId: t.instId, defName: DEFS.find((d) => d.id === t.defId).name,
    node: t.node, handler: ME.name, result: result, opinion: txt || (result === '同意' ? '同意' : ''),
    time: '2026-11-19 ' + nowHM(), cost: '12 分'
  });
  TODOS.splice(idx, 1);
  const navBadge = $('.nav-badge');
  if (navBadge) navBadge.textContent = TODOS.length;
  closeDrawer();
  renderRoute();
  toast(result === '同意' ? '已同意，流程流转到下一节点' : '已驳回，流程退回发起人', result === '同意' ? 'ok' : 'warn');
}
function transferTask(id, kind) {
  const idx = TODOS.findIndex((t) => t.id === id);
  if (idx < 0) return;
  const t = TODOS[idx];
  HISTORY.unshift({
    id: 'HT-' + String(30 + (seq++)), instId: t.instId, defName: DEFS.find((d) => d.id === t.defId).name,
    node: t.node, handler: ME.name, result: kind, opinion: kind === '转办' ? '转办给王芳处理' : '加签销售总监复核',
    time: '2026-11-19 ' + nowHM(), cost: '—'
  });
  if (kind === '转办') TODOS.splice(idx, 1);
  closeDrawer(); renderRoute();
  toast(kind === '转办' ? '已转办给王芳' : '已加签销售总监，任务仍在你的待办中', 'ok');
}

function openHisDrawer(id) {
  const h = HISTORY.find((x) => x.id === id);
  if (!h) return;
  const inst = INSTANCES.find((i) => i.id === h.instId);
  const def = inst ? DEFS.find((d) => d.id === inst.defId) : null;
  const body = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">' + resultChip(h.result) + '<span class="mono">' + esc(h.id) + '</span></div>' +
    '<div class="kv">' + kvRow('所属流程', h.defName) + kvRow('节点', h.node) +
    kvRow('办理人', h.handler) + kvRow('完成时间', h.time) + kvRow('节点耗时', h.cost) + kvRow('实例编号', h.instId) + '</div>' +
    '<div class="sec-title">审批意见</div>' +
    '<div style="font-size:12.5px;line-height:1.9;background:#fafbfd;border:1px solid #f0f3f8;border-radius:9px;padding:10px 12px;color:#5f6b7f">' + (esc(h.opinion) || '无') + '</div>' +
    (def ? '<div class="sec-title">当时流程位置</div><div class="dgram-wrap">' + diagram(def.nodes, def.edges, { states: inst ? statesFor(inst) : {}, liveFrom: liveFromOf(inst) }) + '</div>' : '');
  openDrawer(h.node + ' · ' + h.result, h.defName + ' · ' + (inst ? inst.title : ''), body,
    '<span class="hint">记录保留 180 天，可按实例追溯</span><div class="right"><button class="btn" data-act="close-drawer">关闭</button>' +
    (inst ? '<button class="btn pri" data-act="inst-open" data-id="' + inst.id + '">查看实例</button>' : '') + '</div>', 780);
}

function openFlowDrawer(instId) {
  const inst = INSTANCES.find((i) => i.id === instId);
  if (!inst) return;
  const def = DEFS.find((d) => d.id === inst.defId);
  const body = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">' + instStatusChip(inst.status) +
    '<span style="font-size:12px;color:#5f6b7f">当前节点：' + esc(inst.cur) + '</span></div>' +
    '<div class="dgram-wrap">' + diagram(def.nodes, def.edges, { states: statesFor(inst), liveFrom: liveFromOf(inst) }) + '</div>' +
    '<div class="legend-bar"><span class="lg"><i style="background:#ecfaf3;border:1px solid #0f9f6e"></i>已办结</span>' +
    '<span class="lg"><i style="background:#eef4ff;border:1px solid #2563eb"></i>当前节点</span>' +
    '<span class="lg"><i style="background:#fff;border:1px solid #dde3ed"></i>未到达</span></div>';
  openDrawer('流程图 · ' + inst.id, inst.title, body,
    '<span class="hint">共 ' + (inst.passed || []).length + ' / ' + def.nodes.length + ' 个节点已办结</span>' +
    '<div class="right"><button class="btn" data-act="close-drawer">关闭</button><button class="btn pri" data-act="inst-open" data-id="' + inst.id + '">实例详情</button></div>', 880);
}

function openPreviewDrawer() {
  const d = designer;
  openDrawer('流程图预览 · ' + d.name, d.code + ' · 未发布的草稿定义',
    '<div class="dgram-wrap">' + diagram(d.nodes, d.edges, {}) + '</div>' +
    '<div class="legend-bar">即将发布的节点 ' + d.nodes.length + ' 个 · 跳线 ' + d.edges.length + ' 条</div>',
    '<span class="hint">预览为只读，关闭后继续编辑</span><div class="right"><button class="btn pri" data-act="close-drawer">关闭</button></div>', 880);
}

/* =======================================================================
   路由
   ======================================================================= */
function renderRoute() {
  if ($('#drawer').classList.contains('on')) closeDrawer();
  const h = (location.hash || '#/overview').replace(/^#\/?/, '');
  const seg = h.split('/')[0] || 'overview';
  const arg = h.split('/')[1] || '';
  let html = '';
  designerActive = false;
  if (seg === 'overview') html = viewOverview();
  else if (seg === 'definition') html = viewDefinition();
  else if (seg === 'designer') html = viewDesigner(arg || 'def_001');
  else if (seg === 'instance') html = arg ? viewInstanceDetail(arg) : viewInstance();
  else if (seg === 'todo') html = viewTodo();
  else if (seg === 'history') html = viewHistory();
  else if (seg === 'flow') html = viewFlow();
  else html = viewOverview();
  $('#content').innerHTML = html;
  $('#content').scrollTop = 0;

  const c = CRUMB[seg] || '工作流概览';
  $('#crumb').innerHTML = '<span>工作流中心</span><span style="color:#c8d0dd">/</span><b>' + c + '</b>' +
    (seg === 'instance' && arg ? '<span style="color:#c8d0dd">/</span><span class="mono">' + esc(arg) + '</span>' : '');
  renderNav(seg);
  if (seg === 'designer') bindDesigner();
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('load', () => {
  if (!location.hash) location.hash = '#/overview';
  renderRoute();
});
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  if (!location.hash) location.hash = '#/overview';
  renderRoute();
}
</script>
</body>
</html>
