spring:
  cloud:
    nacos:
      discovery:
        heart-beat-interval: 1000
        metadata:
          env-tag: ${ENV_TAG:${user.name}}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
