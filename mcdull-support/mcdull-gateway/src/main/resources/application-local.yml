spring:
  cloud:
    nacos:
      discovery:
        heart-beat-interval: 1000
        metadata:
          env-tag: ${ENV_TAG:${user.name}}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9000}

mcdull:
  tag:
    enabled: false
    strict: false
    clean-header: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
