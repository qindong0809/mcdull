spring:
  # 全局限流 RequestRateLimiter 与 Sa-Token 会话均依赖 Redis
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST}
      port: ${GATEWAY_REDIS_PORT:6379}
      password: ${GATEWAY_REDIS_PASSWORD:}
      database: ${GATEWAY_REDIS_DB:1}
      timeout: ${GATEWAY_REDIS_TIMEOUT:3s}
  cloud:
    nacos:
      discovery:
        heart-beat-interval: 5000
        metadata:
          env-tag: ${ENV_TAG:}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # 自动服务发现路由会让内部接口绕过网关鉴权，test/prod 一律关闭
              enabled: false
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9000}

mcdull:
  tag:
    enabled: ${GATEWAY_TAG_ENABLED:true}
    strict: false
    clean-header: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO
