server:
  port: ${GATEWAY_SERVER_PORT:9090}

spring:
  application:
    name: mcdull-gateway
  profiles:
    # 不设默认值：缺失时直接启动失败，避免生产误用本地配置
    active: ${SPRING_PROFILES_ACTIVE}
  cache:
    type: caffeine
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:mcdull.io:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
    inetutils:
      ignored-interfaces:
        - docker0
        - veth.*
        - VMware.*
    gateway:
      server:
        webflux:
          # 全局超时保护收归本地
          httpclient:
            connect-timeout: 5000
            response-timeout: 30000
            pool:
              type: elastic
              max-idle-time: 15000
          # 核心业务路由直接写在本地，随 Git 版本受控管理
          routes:
            # 前端统一以 /api/{service} 前缀接入；StripPrefix=2 去掉 /api/system 或 /api/blaze 两段，后端 Controller 路径保持不变
            - id: system-bootstrap-api
              uri: lb://system-bootstrap
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=2

            - id: blaze-bootstrap-api
              uri: lb://blaze-bootstrap
              predicates:
                - Path=/api/blaze/**
              filters:
                - StripPrefix=2

            # 兼容存量 /uac/** 调用（前端已切换为 /api/system，后续可清理）
            - id: system-bootstrap
              uri: lb://system-bootstrap
              predicates:
                - Path=/uac/**
              filters:
                - StripPrefix=1

            # 前端已统一以 /api/workflow 前缀接入；后端 Controller 自带 /workflow 前缀，StripPrefix=1 仅剥离 /api
            - id: workflow-bootstrap-api
              uri: lb://workflow-bootstrap
              predicates:
                - Path=/api/workflow/**
              filters:
                - StripPrefix=1

            # 兼容存量 /workflow/** 调用（前端已切换为 /api/workflow，后续可清理）
            - id: workflow-bootstrap
              uri: lb://workflow-bootstrap
              predicates:
                - Path=/workflow/**

            - id: mcdull-mdc-provider
              uri: lb://mcdull-mdc-provider
              predicates:
                - Path=/mdc/**
              filters:
                - StripPrefix=1

            - id: demo-http
              uri: https://httpbin.org
              predicates:
                - Path=/httpbin/**
              filters:
                - StripPrefix=1
          # 全局默认过滤器收归本地
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

# 与业务服务保持一致：网关直接读取前端提交的 Authorization token
sa-token:
  active-timeout: 1800
  timeout: 86400
  token-name: Authorization
  is-concurrent: false
  is-share: false
  token-style: tik
  auto-renew: true
  is-log: true
  log-level: info
  is-print: false
  is-read-cookie: false

# 监控端点安全规范收归本地
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE}
