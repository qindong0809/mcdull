server:
  port: 9090

spring:
  application:
    name: mcdull-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: caffeine
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:mcdull.io:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        # 保留服务发现与命名空间隔离（核心注册中心能力）
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active}}
      config:
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active}}
        file-extension: yaml
    inetutils:
      ignored-interfaces:
        - docker0
        - veth.*
        - VMware.*
    gateway:
      server:
        webflux:
          # 1. 全局超时保护收归本地
          httpclient:
            connect-timeout: 5000
            response-timeout: 30000
            pool:
              type: elastic
              max-idle-time: 15000
          # 2. 核心业务路由直接写在本地，随 Git 版本受控管理
          routes:
            - id: system-bootstrap
              uri: lb://system-bootstrap
              predicates:
                - Path=/uac/**
              filters:
                - StripPrefix=1

            - id: mcdull-mdc-provider
              uri: lb://mcdull-mdc-provider
              predicates:
                - Path=/mdc/**
              filters:
                - StripPrefix=1

            - id: demo-http
              uri: https://httpbin.org
              predicates:
                - Path=/httpbin/**
              filters:
                - StripPrefix=1
          # 3. 全局默认过滤器收归本地
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

  # 仅导入跨微服务共享的基础中间件配置，彻底移除 mcdull-gateway.yaml
  config:
    import:
      - optional:nacos:sa-token.yaml?group=DEFAULT_GROUP
      - optional:nacos:redis.yaml?group=DEFAULT_GROUP
      - optional:nacos:springboot-admin.yaml?group=DEFAULT_GROUP

# 监控端点安全规范收归本地
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
