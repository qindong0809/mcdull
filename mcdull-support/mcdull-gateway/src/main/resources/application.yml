server:
  port: ${GATEWAY_SERVER_PORT:9090}

spring:
  application:
    name: mcdull-gateway
  profiles:
    # 不设默认值：缺失时直接启动失败，避免生产误用本地配置
    active: ${SPRING_PROFILES_ACTIVE}
  cache:
    type: caffeine
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:mcdull.io:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
    inetutils:
      ignored-interfaces:
        - docker0
        - veth.*
        - VMware.*
    gateway:
      server:
        webflux:
          # 全局超时保护收归本地
          httpclient:
            connect-timeout: 5000
            response-timeout: 30000
            pool:
              type: elastic
              max-idle-time: 15000
          # 核心业务路由直接写在本地，随 Git 版本受控管理
          routes:
            - id: system-bootstrap
              uri: lb://system-bootstrap
              predicates:
                - Path=/uac/**
              filters:
                - StripPrefix=1

            - id: workflow-bootstrap
              uri: lb://workflow-bootstrap
              predicates:
                - Path=/workflow/**

            - id: mcdull-mdc-provider
              uri: lb://mcdull-mdc-provider
              predicates:
                - Path=/mdc/**
              filters:
                - StripPrefix=1

            - id: demo-http
              uri: https://httpbin.org
              predicates:
                - Path=/httpbin/**
              filters:
                - StripPrefix=1
          # 全局默认过滤器收归本地
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

# 监控端点安全规范收归本地
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE}
