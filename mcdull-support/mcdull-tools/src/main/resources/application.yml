server:
    port: 7080
spring:
  data:
    redis:
      # Redis服务器地址
      host: mcdull.io
      # Redis服务器连接端口
      port: 6379
  datasource:
    url: jdbc:mysql://mcdull.io:3306/mcdull-cloud-3?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    maxActive: 10
    initialSize: 1
    maxWait: 60000
    minIdle: 1
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: select 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxOpenPreparedStatements: 20
    logSlowSql: true
    allow:
    adminUser: root
    adminPassword: 8YTJWOuA7XRK17wRQnw4
  thymeleaf:
    enabled: true
    cache: false
    encoding: UTF-8
    mode: HTML
    suffix: .html
    prefix: classpath:/static/
log:
  enable: false
mcdull:
  gateway:
    no-auth:
      - /**
  tools:
    log:
      # Legacy fallback (used when targets list is empty)
      dir: D:/var/log/mcdull-uac-provider
      active-file: out.log
      charset: UTF-8
      page-lines: 300
      max-scan-bytes: 33554432
      tail-interval-millis: 500
      heartbeat-millis: 15000
      # Named credentials (passwords read from env vars in production)
      credentials:
        test:
          username: xxx
          password: xxx
        # 公钥认证
        staging-key-encrypted:
          username: xxx
          private-key-path: D:/workspace/code/xxx-20250506.pem
      # Targets shown in the UI selector
      targets:
        - id: local
          env: 本机
          service: mcdull-tools
          dir: D:/var/log/mcdull-uac-provider
          pattern: "out*.log*"
          active-file: out.log
          charset: UTF-8
          # 用户名密码
        - id: test
          env: 测试
          service: uac-provider
          host: mcdull.io
          port: 22
          credential: test
          dir: /home/nacos/logs
          pattern: "*.log*"
          active-file: nacos.log
          charset: UTF-8
          # 密钥证书
        - id: staging-key-encrypted
          env: 测试
          service: 测试服务器-01
          host: dev-xxxx.cn
          port: 22
          credential: staging-key-encrypted
          dir: /home/deployment/xxxx/log
          pattern: "*.log*"
          active-file: xxx_log.log
          charset: UTF-8
        - id: staging-key-encrypted
          env: 测试
          service: 测试服务器-02
          host: dev-xxxx.cn
          port: 22
          credential: staging-key-encrypted
          dir: /home/deployment/xxxx/log
          pattern: "*.log*"
          active-file: xxx_log.log
          charset: UTF-8
